groups:
  - name: salud-total-erp
    rules:
      - alert: BackendCaido
        expr: up{job="articulos-backend"} == 0
        for: 1m
        labels:
          severidad: critica
        annotations:
          resumen: "El backend no responde a Prometheus"
          accion: "Revisar docker compose ps y logs; si la versión nueva falla, ejecutar ci/rollback.ps1"

      - alert: ErroresServidor5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severidad: alta
        annotations:
          resumen: "La API devuelve errores 5xx"
          accion: "Buscar error.stack_trace en los logs JSON del backend"

      - alert: LatenciaVentasAlta
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri="/api/ventas", method="POST"}[5m]))) > 2
        for: 5m
        labels:
          severidad: media
        annotations:
          resumen: "p95 de registro de ventas mayor a 2 s (RNF-14)"
          accion: "Revisar el pool de conexiones y bloqueos de filas de productos"

      - alert: OutboxEventosAtascados
        expr: articulos_outbox_eventos{estado="PENDIENTE"} > 0
        for: 5m
        labels:
          severidad: media
        annotations:
          resumen: "Hay eventos del Outbox sin procesar por más de 5 minutos"
          accion: "Verificar el hilo PostgresOutboxListener y la conexión LISTEN"

      - alert: OutboxEventosConError
        expr: articulos_outbox_eventos{estado="ERROR"} > 0
        labels:
          severidad: media
        annotations:
          resumen: "Hay eventos del Outbox que fallaron"
          accion: "Revisar la tabla cola_eventos y reintentar"

      - alert: OrdenesReabastecimientoPendientes
        expr: articulos_reabastecimiento_ordenes{estado="PENDIENTE"} > 0
        for: 24h
        labels:
          severidad: baja
        annotations:
          resumen: "Hay órdenes de reabastecimiento pendientes por más de 24 h"
          accion: "Avisar al comprador antes de que venzan a las 72 h (RN-13)"
