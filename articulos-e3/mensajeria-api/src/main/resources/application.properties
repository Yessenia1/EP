server.port=${SERVER_PORT:8087}

whatsapp.api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v18.0/TU_PHONE_NUMBER_ID/messages}
whatsapp.api.token=${WHATSAPP_API_TOKEN:sin-configurar}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
