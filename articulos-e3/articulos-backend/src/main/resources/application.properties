spring.application.name=articulos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.main.allow-bean-definition-overriding=true
server.port=${SERVER_PORT:8085}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jackson.time-zone=America/Lima

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:classpath:certs/private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:classpath:certs/public.pem}
jwt.expiration=1800000

security.max-failed-attempts=5
security.block-duration-minutes=15
security.suspicious-ip-change-hours=1
security.max-concurrent-sessions=3

ventas.fefo.estricto=${VENTAS_FEFO_ESTRICTO:true}
reabastecimiento.horas-vencimiento=72
reabastecimiento.cron=0 0 * * * *

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4205}

mensajeria.api.url=${MENSAJERIA_API_URL:http://localhost:8087}

archivos.directorio=${ARCHIVOS_DIRECTORIO:/var/laboratorio/archivos}
archivos.max-size=10MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=articulos
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=500ms,1s,2s

logging.pattern.console=%5p %-40.40logger{39} : %m%n
