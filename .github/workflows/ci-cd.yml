name: CI/CD Salud Total ERP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/salud-total-erp

jobs:
  backend:
    name: Backend - compilar, probar y analizar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinica_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: articulos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas y cobertura (JUnit + JaCoCo)
        env:
          DB_URL: jdbc:postgresql://localhost:5432/clinica_db
          DB_USER: ci
          DB_PASSWORD: ci
        run: ./mvnw -B verify
      - name: Análisis estático (PMD + CPD)
        run: ./mvnw -B pmd:pmd pmd:cpd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-backend
          path: |
            articulos-backend/target/surefire-reports
            articulos-backend/target/site/jacoco
            articulos-backend/target/pmd.xml
            articulos-backend/target/cpd.xml

  mensajeria:
    name: mensajeria-api - compilar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mensajeria-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend - build de producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: articulos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: articulos-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagenes:
    name: Construir y publicar imágenes
    needs: [backend, mensajeria, frontend, secretos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [articulos-backend, mensajeria-api, articulos-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.servicio }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.servicio }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.servicio }}:latest

  desplegar:
    name: Desplegar en staging y pruebas de humo
    needs: imagenes
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar versión con rollback automático
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "$SSH_KEY" > clave && chmod 600 clave
          ssh -i clave -o StrictHostKeyChecking=no deploy@$HOST \
            "cd /opt/salud-total-erp && git pull && APP_VERSION=${{ github.sha }} ./ci/desplegar.sh"
      - name: Pruebas de humo (Newman)
        run: |
          npm i -g newman
          newman run pruebas/postman/E3_SaludTotal.postman_collection.json \
            --env-var base_url=https://${{ secrets.STAGING_HOST }}
